<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Destroy</title>
  </head>
  <body>
    <main>
      <div class="brand"><img src="/assets/icons/flame-48.png" width="32" height="32" alt="" /><b id="name">Destroy</b></div>
      <p id="hint"></p>
      <button id="summon"></button>
      <p id="notice" role="status"></p>
      <div class="row">
        <span id="shortcut-label"></span
        ><button id="shortcut" class="link"></button>
      </div>
      <label class="row"
        ><span id="language-label"></span
        ><select id="language">
          <option value="auto">Auto</option>
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select></label
      ><label class="row"
        ><span id="sound-label"></span
        ><input id="sound" type="checkbox" /></label
      ><label class="row"
        ><span id="volume-label"></span
        ><input id="volume" type="range" min="0" max="100"
      /></label>
      <label class="row"
        ><span id="musicVolume-label"></span
        ><input id="musicVolume" type="range" min="0" max="100"
      /></label>
      <label class="row"
        ><span id="effectsVolume-label"></span
        ><input id="effectsVolume" type="range" min="0" max="100"
      /></label>
      <button id="preview" class="link"></button>
      <p class="privacy" id="privacy"></p>
      <details>
        <summary id="about-label"></summary>
        <p>
          Destroy 0.1.2 · CC0 audio<br />
          <a href="https://kenney.nl/assets" target="_blank" rel="noreferrer"
            >Kenney</a
          >
          ·
          <a
            href="https://opengameart.org/content/short-loops-background-music-pack"
            target="_blank"
            rel="noreferrer"
            >hernandack</a
          >
          ·
          <a
            href="https://opengameart.org/content/80-cc0-creature-sfx"
            target="_blank"
            rel="noreferrer"
            >rubberduck</a
          >
        </p>
      </details>
    </main>
    <script type="module" src="/src/popup/index.ts"></script>
  </body>
</html>
